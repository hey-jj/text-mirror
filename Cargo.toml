[package]
name = "text-mirror"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Converts binary and rich files into text and builds a replica text-mirror tree beside a manifest recording the source, hash, and converter behind every artifact"
keywords = ["conversion", "text-extraction", "corpus", "provenance", "manifest"]
categories = ["command-line-utilities", "parsing"]
readme = "README.md"
repository = "https://github.com/hey-jj/text-mirror"
documentation = "https://docs.rs/text-mirror"
rust-version = "1.88"
exclude = ["AGENTS.md", "/tests"]

[lib]
name = "text_mirror"
path = "src/lib.rs"

[[bin]]
name = "text-mirror"
path = "src/main.rs"

[[bin]]
name = "text-mirror-worker"
path = "src/bin/worker.rs"

[features]
# Compiles the harness and fake-engine worker modes used by the
# contract tests. Enabled through the self dev-dependency below, so
# `cargo test` builds them and a production `cargo build` does not.
test-adapters = []
# Compiles the jailed records worker: the parquet, avro, and sqlite
# readers that run inside the subprocess sandbox. Off by default, so a
# library build and the main CLI pull none of the heavy native parser
# trees. The self dev-dependency below turns it on so `cargo test`
# exercises the readers, exactly as it does the fake engines above.
records-worker = ["dep:parquet", "dep:apache-avro", "dep:rusqlite"]
# Compiles the in-jail raster-image decode path: png, jpeg, and webp
# are decoded by the pure-Rust image crate inside the subprocess
# sandbox before the pinned vision engine reads the pixels. Off by
# default, so a build without it routes those formats to a deliberate
# image-ocr-not-built capability gap. The self dev-dependency below
# turns it on so `cargo test` exercises the decode path.
image-ocr = ["dep:image"]
# Compiles the in-jail audio decode path: wav, mp3, flac, and AAC-LC
# m4a are decoded by the pure-Rust symphonia crate inside the
# subprocess sandbox to a native-rate, native-channel s16 wav the
# pinned speech engine reads. Off by default, so a build without it
# routes those formats to a deliberate audio-asr-not-built capability
# gap. The self dev-dependency below turns it on so `cargo test`
# exercises the decode path against the fake engine.
audio-asr = ["dep:symphonia"]
# Compiles the in-jail image-metadata reader: the exif, png text-chunk,
# container packet, xmp, iptc, and iso base media file format parsers
# that lift textual metadata out of a raster and render it as a hidden
# derived child. Off by default, so a library build and the main CLI
# pull none of these parser trees. The self dev-dependency below turns
# it on so `cargo test` exercises the readers, exactly as it does the
# records readers and the image decode path above.
image-metadata = ["dep:kamadak-exif", "dep:png", "dep:img-parts"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
blake3 = "=1.8.6"
clap = { version = "=4.6.6", features = ["derive"] }
walkdir = "=2.5.0"
file-format = { version = "=0.29.0", features = ["reader-zip"] }
unicode-normalization = "=0.1.25"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
anydoc = "=0.1.9"
# Streaming html strip. BSD-3-Clause, with MPL-2.0 crates in its CSS
# subtree, all consumed unmodified. See THIRD-PARTY-NOTICES.md.
lol_html = "=3.0.1"
# MIME structure and headers with lazy bodies: attachment bytes are
# never decoded during enumeration.
mailparse = "=0.16.1"
office_oxide = "=0.1.8"
calamine = "=0.36.1"
# Pins anydoc's transitive PDF parser, which anydoc declares as a caret range.
pdf-inspector = "=1.14.2"
quick-xml = "=0.41.0"
cfb = "=0.14.0"
# Runtime use is limited to reading visibility XML out of OOXML and ODF
# archives. Same version and feature set as anydoc's own zip dependency.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# Captures anydoc's recovery warnings into manifest records. Same
# version already in the tree through anydoc.
log = "=0.4.33"
pulldown-cmark = { version = "=0.13.4", default-features = false }

# Records-worker readers. Optional and gated behind the records-worker
# feature, so a default build pulls none of these native trees. Their
# CVE history and large transitive surface are the reason the readers
# run only inside the subprocess jail.
parquet = { version = "=59.2.0", default-features = false, features = ["brotli", "crc", "flate2-rust_backend", "lz4", "snap", "zstd"], optional = true }
apache-avro = { version = "=0.22.0", default-features = false, features = ["snappy"], optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"], optional = true }

# Pure-Rust raster decoder for the in-jail image-OCR path. default-features
# = false is load-bearing: the three explicit format features select
# exactly png, jpeg (zune-jpeg), and webp (image-webp), all pure Rust.
# tiff is deliberately excluded so it stays engine-unpinned and never
# becomes silently decodable through this dependency, and rayon stays off
# so the decode is single-threaded under the jail's process ceiling.
# Gated behind the image-ocr feature, so a default build pulls none of it.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }

# Pure-Rust audio decoder for the in-jail speech path. default-features
# = false is load-bearing: the explicit features select exactly the
# wav, mp3, flac, and isomp4/aac paths plus pcm sample conversion, all
# pure Rust. alac is deliberately excluded so an ALAC track stays a
# named codec rejection and never becomes silently decodable through
# this dependency. Gated behind the audio-asr feature, so a default
# build pulls none of it.
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "pcm", "wav"], optional = true }

# In-jail image-metadata readers. Optional and gated behind the
# image-metadata feature, so a default build pulls none of them. All
# three are pure Rust and add no native build dependency: kamadak-exif
# (imports as `exif`, BSD-2-Clause) reads exif; png with
# default-features = false reads the tEXt, zTXt, and iTXt text chunks,
# its unconditional inflate backend reaching the compressed-chunk path;
# and img-parts frames the jpeg segment list and the webp riff chunks
# so each embedded metadata packet reaches its surface parser. The xmp,
# svg, iptc, and iso base media file format parsing reuse the pinned
# quick-xml and first-party bounded code, so they add no dependency.
kamadak-exif = { version = "=0.6.1", optional = true }
png = { version = "=0.18.1", default-features = false, optional = true }
img-parts = { version = "=0.4.0", optional = true }

[target.'cfg(unix)'.dependencies]
rlimit = "=0.11.0"
nix = { version = "=0.31.3", default-features = false, features = ["process", "sched", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Safe wrappers over the process-information calls the parent-side
# resident-memory monitor needs: enumerate a process group and read
# each member's resident footprint. The unsafe FFI stays inside this
# dependency, so the crate keeps forbid(unsafe_code).
libproc = "=0.14.10"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"

[dev-dependencies]
text-mirror = { path = ".", features = ["test-adapters", "records-worker", "image-ocr", "image-metadata", "audio-asr"] }
