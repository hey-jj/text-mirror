[package]
name = "text-mirror"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Converts binary and rich files into text and builds a replica text-mirror tree with a provenance manifest"
keywords = ["conversion", "text-extraction", "corpus", "provenance", "manifest"]
categories = ["command-line-utilities", "parsing"]

[lib]
name = "text_mirror"
path = "src/lib.rs"

[[bin]]
name = "text-mirror"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
blake3 = "=1.8.6"
clap = { version = "=4.6.6", features = ["derive"] }
walkdir = "=2.5.0"
file-format = { version = "=0.29.0", features = ["reader-zip"] }
unicode-normalization = "=0.1.25"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
anydoc = "=0.1.9"
office_oxide = "=0.1.8"
calamine = "=0.36.1"
# Pins anydoc's transitive PDF parser, which anydoc declares as a caret range.
pdf-inspector = "=1.14.2"
quick-xml = "=0.41.0"
cfb = "=0.14.0"
# Runtime use is limited to reading visibility XML out of OOXML and ODF
# archives. Same version and feature set as anydoc's own zip dependency.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# Captures anydoc's recovery warnings into manifest records. Same
# version already in the tree through anydoc.
log = "=0.4.33"
pulldown-cmark = { version = "=0.13.4", default-features = false }
