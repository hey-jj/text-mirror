[package]
name = "text-mirror"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Converts binary and rich files into text and builds a replica text-mirror tree with a provenance manifest"
keywords = ["conversion", "text-extraction", "corpus", "provenance", "manifest"]
categories = ["command-line-utilities", "parsing"]

[lib]
name = "text_mirror"
path = "src/lib.rs"

[[bin]]
name = "text-mirror"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
blake3 = "=1.8.6"
clap = { version = "=4.6.6", features = ["derive"] }
walkdir = "=2.5.0"
file-format = { version = "=0.29.0", features = ["reader-zip"] }
unicode-normalization = "=0.1.25"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
