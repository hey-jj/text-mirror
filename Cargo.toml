[package]
name = "text-mirror"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Converts binary and rich files into text and builds a replica text-mirror tree beside a manifest recording the source, hash, and converter behind every artifact"
keywords = ["conversion", "text-extraction", "corpus", "provenance", "manifest"]
categories = ["command-line-utilities", "parsing"]
readme = "README.md"
repository = "https://github.com/hey-jj/text-mirror"
documentation = "https://docs.rs/text-mirror"
rust-version = "1.88"
exclude = ["AGENTS.md", "/tests"]

[lib]
name = "text_mirror"
path = "src/lib.rs"

[[bin]]
name = "text-mirror"
path = "src/main.rs"

[[bin]]
name = "text-mirror-worker"
path = "src/bin/worker.rs"

[features]
# Compiles the harness and fake-engine worker modes used by the
# contract tests. Enabled through the self dev-dependency below, so
# `cargo test` builds them and a production `cargo build` does not.
test-adapters = []
# Compiles the jailed records worker: the parquet, avro, and sqlite
# readers that run inside the subprocess sandbox. Off by default, so a
# library build and the main CLI pull none of the heavy native parser
# trees. The self dev-dependency below turns it on so `cargo test`
# exercises the readers, exactly as it does the fake engines above.
records-worker = ["dep:parquet", "dep:apache-avro", "dep:rusqlite"]
# Compiles the in-jail raster-image decode path: png, jpeg, and webp
# are decoded by the pure-Rust image crate inside the subprocess
# sandbox before the pinned vision engine reads the pixels. Off by
# default, so a build without it routes those formats to a deliberate
# image-ocr-not-built capability gap. The self dev-dependency below
# turns it on so `cargo test` exercises the decode path.
image-ocr = ["dep:image"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
blake3 = "=1.8.6"
clap = { version = "=4.6.6", features = ["derive"] }
walkdir = "=2.5.0"
file-format = { version = "=0.29.0", features = ["reader-zip"] }
unicode-normalization = "=0.1.25"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
anydoc = "=0.1.9"
# Streaming html strip. BSD-3-Clause, with MPL-2.0 crates in its CSS
# subtree, all consumed unmodified. See THIRD-PARTY-NOTICES.md.
lol_html = "=3.0.1"
# MIME structure and headers with lazy bodies: attachment bytes are
# never decoded during enumeration.
mailparse = "=0.16.1"
office_oxide = "=0.1.8"
calamine = "=0.36.1"
# Pins anydoc's transitive PDF parser, which anydoc declares as a caret range.
pdf-inspector = "=1.14.2"
quick-xml = "=0.41.0"
cfb = "=0.14.0"
# Runtime use is limited to reading visibility XML out of OOXML and ODF
# archives. Same version and feature set as anydoc's own zip dependency.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# Captures anydoc's recovery warnings into manifest records. Same
# version already in the tree through anydoc.
log = "=0.4.33"
pulldown-cmark = { version = "=0.13.4", default-features = false }

# Records-worker readers. Optional and gated behind the records-worker
# feature, so a default build pulls none of these native trees. Their
# CVE history and large transitive surface are the reason the readers
# run only inside the subprocess jail.
parquet = { version = "=59.2.0", default-features = false, features = ["brotli", "crc", "flate2-rust_backend", "lz4", "snap", "zstd"], optional = true }
apache-avro = { version = "=0.22.0", default-features = false, features = ["snappy"], optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"], optional = true }

# Pure-Rust raster decoder for the in-jail image-OCR path. default-features
# = false is load-bearing: the three explicit format features select
# exactly png, jpeg (zune-jpeg), and webp (image-webp), all pure Rust.
# tiff is deliberately excluded so it stays engine-unpinned and never
# becomes silently decodable through this dependency, and rayon stays off
# so the decode is single-threaded under the jail's process ceiling.
# Gated behind the image-ocr feature, so a default build pulls none of it.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }

[target.'cfg(unix)'.dependencies]
rlimit = "=0.11.0"
nix = { version = "=0.31.3", default-features = false, features = ["process", "sched", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"

[dev-dependencies]
text-mirror = { path = ".", features = ["test-adapters", "records-worker", "image-ocr"] }
