# Converter registry for text-mirror.
#
# Each entry pins a converter id, its version, and the format ids it
# claims. A format no entry claims produces status unsupported with a
# machine-readable reason: a declared reason from the entries at the
# bottom of this file, or the generic floor no-converter. The version
# must match the version in formats.toml and is recorded in every
# manifest record as rules_version.

version = "10"

# The passthrough validates UTF-8 and fails closed on anything else,
# so a binary wearing one of these extensions records failed with
# invalid_utf8. That floor is what makes a broad list safe.
[[converters]]
id = "text-passthrough"
version = "1.2.0"
formats = [
  "text", "markdown", "csv",
  # Structured text and data interchange.
  "json", "jsonl", "yaml", "xml", "tsv", "toml", "ini", "env",
  # Markup whose raw text is the content. svg passes through as raw
  # markup, and ipynb as the raw notebook json, so every cell source,
  # output, and metadata string reaches the artifact.
  "svg", "ipynb",
  # Source code and scripts.
  "python", "shell", "rust", "javascript", "typescript", "sql",
  "ruby", "go", "java", "c", "cpp", "csharp", "php", "perl",
  "powershell", "batch",
  # Infrastructure and analytics tool text.
  "terraform", "hcl", "lookml", "tmdl", "pbip",
  "tableau-workbook", "tableau-datasource",
]

# Streaming strip to visible text: script, style, template, noscript,
# and non-title head content are dropped, block boundaries become line
# breaks, entities decode, whitespace collapses.
[[converters]]
id = "html-strip"
version = "1.0.0"
formats = ["html"]

# MIME message to text: a fixed header subset, then the text body
# parts. An html-only body runs through the html strip path.
# Attachments are enumerated as warnings and never decoded until
# container expansion lands. msg stays unrouted, it is a compound
# file, so it sits on the no-converter floor.
[[converters]]
id = "eml-mime"
version = "1.0.0"
formats = ["eml"]

[[converters]]
id = "anydoc-document"
version = "1.0.0"
formats = ["docx", "doc", "pptx", "ppt", "rtf", "odt", "odp", "epub"]

[[converters]]
id = "workbook-ir"
version = "1.0.0"
formats = ["xls", "xlsx", "xlsm", "ods"]

# Text-layer PDF runs behind the sandbox runner in the worker binary,
# so hostile PDF bytes crash a jailed child and never the pipeline.
# The outcome, warnings, and failure reasons match the earlier
# in-process path, so records differ only in this converter id.
#
# ai routes here too: a modern .ai is a PDF-compatible container, so
# extracting its text layer through this same path keeps the pdf-family
# warnings and the recovery route. A legacy PostScript-backed .ai has
# no PDF text layer and fails closed with a pdf-family reason.
[[converters]]
id = "pdf-subprocess"
version = "1.0.0"
formats = ["pdf", "ai"]

# Raster images run pixel-only OCR behind the subprocess jail. The
# image bytes are decoded in-jail by the pure-Rust image crate, the
# encoder-input area cap is asserted, and the pinned vision engine
# reads the pixels. Gated behind the image-ocr feature; without it
# these formats route to image-ocr-not-built at registry construction.
# The limits live in the [image_ocr] section below.
[[converters]]
id = "image-pixel-ocr"
version = "1.0.0"
formats = ["png", "jpeg", "webp"]

# Image-metadata is an auxiliary converter: one image source yields the
# pixel-OCR text as its primary artifact and the textual metadata as a
# hidden derived child at <source>.d/#image-metadata. It claims no
# formats, so it never enters the format routing table and never competes
# for a claim; the pipeline runs it as a derived-child leg for the image
# carriers. The exif, png text-chunk, xmp, iptc, and iso base media file
# format parsers all run behind the same subprocess jail as the records
# worker. Gated behind the image-metadata feature; without it, and with
# no formats to route, the entry is skipped at registry construction. The
# ceilings live in the [image_metadata] section below.
[[converters]]
id = "image-metadata"
version = "1.0.0"
formats = []

# Parquet, avro, and sqlite run behind the same subprocess jail as the
# PDF path. These parsers pull large native trees with CVE history, so
# hostile bytes crash a jailed child and never the pipeline. Each
# renders to inert tab-separated text with a header line, and sqlite
# dumps one table per sheet boundary. The ceilings live in the
# [records] section below.
[[converters]]
id = "records-worker"
version = "1.0.0"
formats = ["parquet", "avro", "sqlite"]

# Audio runs speech transcription behind the subprocess jail. The
# audio bytes are decoded in-jail by the pure-Rust symphonia crate to a
# native-rate, native-channel s16 wav, the decoded-duration and
# decoded-size preflights are asserted, and the pinned speech engine
# reads the wav. Gated behind the audio-asr feature; without it these
# formats route to audio-asr-not-built at registry construction, and on
# a platform outside the pinned machine class they route back to
# engine-unpinned. The limits and the pinned runtime hashes live in the
# [asr] section below.
[[converters]]
id = "asr-adapter"
version = "2.0.0"
formats = ["wav", "mp3", "flac", "m4a"]

# Spreadsheet formats with no row and column visibility reader yet.
# They record unsupported with this reason until a reader lands, and
# the rules bump that lands one re-runs every such record.
[[unsupported]]
reason = "hidden-visibility-unresolved"
formats = ["xlsb", "xla", "xlam"]

# Media formats route to subprocess adapters whose engines are not
# pinned yet. Until a rules bump pins an engine version and model
# hash, each records unsupported with this reason and no artifact.
# The checkpoint key includes rules_version, so the bump that pins an
# engine re-runs every such record automatically. png, jpeg, and webp
# moved to the image-pixel-ocr converter above; tiff stays here because
# the in-jail decoder deliberately excludes it. mp3, wav, m4a, and flac
# moved to the asr-adapter above on the pinned platform; everywhere
# else the registry routes them back to this reason at construction,
# because the pinned speech engine identity exists for one machine
# class only and a second class needs its own measured pin.
[[unsupported]]
reason = "engine-unpinned"
formats = [
  "tiff",
  "mp4", "mov",
]

# Formats whose pixels require an external rasterizer that parses
# untrusted bytes outside the pure-Rust jail decode: HEVC-coded heic
# cannot be decoded by the in-jail image crate. Fail closed by default;
# reachable only through the opt-in external-provider config, which is
# not built in this core release.
[[unsupported]]
reason = "no-jailed-rasterizer"
formats = ["heic"]

# Deserializing a pickle stream executes arbitrary code, so no
# pickle deserializer exists in this tree. Never add one. Bytes that
# resolve to the pickle format are refused unconverted with this
# reason. A file wearing a pickle name whose bytes are genuinely
# another format, a docx-shaped zip named .pkl, routes as that format
# under magic-first detection with the mismatch flag raised.
[[unsupported]]
reason = "pickle-deserialization-unsafe"
formats = ["pickle"]

# Recognized data formats with feasible extraction that no converter
# claims yet. Parquet, avro, and sqlite moved to the records worker
# above.
[[unsupported]]
reason = "converter-deferred"
formats = [
  "arrow", "orc", "feather",
  "duckdb", "faiss", "msgpack",
]

# Archive formats awaiting container expansion.
[[unsupported]]
reason = "container-deferred"
formats = ["tar", "gzip", "bzip2", "7z", "rar"]

# Design-tool and app binaries with no public text extraction worth
# building.
[[unsupported]]
reason = "proprietary-binary"
formats = ["sketch", "psd", "fig", "indd", "idml"]

# Zip container expansion limits, versioned with the rest of the
# rules. A source detected as a plain zip expands into a sibling
# .d/ directory, its members route back through the same dispatch,
# and these ceilings bound the zip-bomb surface. Enforcement is two
# stage: the central directory is read first and the child count and
# declared sizes are checked before any inflation, then actual
# inflated bytes are charged during extraction and never trust a
# declared size as the allocation budget.
[containers]
# The outer file is depth 0. Covers eml holding zip holding docx.
max_depth = 4
# Members per container.
max_children = 1000
# Cumulative inflated bytes across one top-level container's whole
# tree, dedup copies included. 1 GiB.
max_expanded_bytes = 1073741824
# One member, uncompressed. 256 MiB.
max_member_size = 268435456

# Records worker ceilings, versioned with the rest of the rules. The
# parent reads them and passes them into the jailed worker, which
# enforces them and fails a source over any ceiling with reason
# record-limit-exceeded and no artifact. A deployment that needs a
# larger file raises them in a visible versioned bump.
[records]
# Records per parquet or avro file, and per sqlite table.
max_records = 100000
# Tables per sqlite database.
max_tables = 256
# Rendered output bytes, under the runner's response cap. 64 MiB.
max_output_bytes = 67108864

# Image-OCR jail limit profile, versioned with the rest of the rules.
# The default runner limits are tuned for the pure-Rust document
# worker; the pinned vision runtime maps a far larger working set, so
# the image-OCR converter carries its own ceilings. They are a
# containment envelope, not a working-set target, and a deployment
# raises them only in a visible versioned bump. RLIMIT_AS is applied on
# Linux only; on macOS the dyld shared cache reserves a large virtual
# range, so the macOS helper does not set it and the wall clock, output
# caps, cpu, file-size, and process caps plus the sandbox are the bound.
[image_ocr]
# Single image: decode plus a bounded greedy decode on the pinned
# compute shape, no batching. 300 s.
wall_timeout_secs = 300
# Clears the worst-case escaped response with over 5x margin, far below
# the 192 MiB default so a runaway frame is still refused. 8 MiB.
max_response_bytes = 8388608
# Engine diagnostics land on stderr; 4 MiB avoids a false overflow from
# ordinary logging while still bounding a flood. 4 MiB.
max_stderr_bytes = 4194304
# A containment ceiling that must exceed the mapped runtime and host
# reservations, which are machine-class bound. 64 GiB.
address_space_bytes = 68719476736
# A GPU runtime spends little CPU; generous so the cpu limit does not
# fire before the wall clock, which is the intended bound. 600 s.
cpu_seconds = 600
# Bounds the in-jail re-encoded raster the engine reads. A 2.36 MP RGB
# raster is under 10 MiB uncompressed and smaller as PNG. 64 MiB.
file_size_bytes = 67108864
# The GPU driver spins its own threads; 64 gives headroom over the
# default 16. A per-uid ceiling, not a per-invocation one.
max_processes = 64

# Speech-transcription jail limit profile, versioned with the rest of
# the rules. Every number is a containment ceiling measured for the
# pinned engine on the pinned machine class, not a working-set target,
# and a deployment changes one only in a visible versioned bump.
# RLIMIT_AS stays unset on this profile: the pinned accelerator runtime
# reserves a virtual range far above any sane cap, the same reason the
# macOS image_ocr profile leaves it unset, and the parent-side resident
# memory guard is the memory bound instead.
[asr]
# Decoded duration cap, asserted in-jail from the decoded frame count
# with a 16-frame priming allowance. Over the cap fails closed with
# asr-duration-exceeded and never truncates.
max_duration_seconds = 3600
# Worst measured 60-minute decode is under 200 s on the pinned class,
# so 900 s is about a 5x margin and still kills a runtime that fell
# off the accelerator hours before it would finish.
wall_timeout_secs = 900
# A legitimate accelerator run spends well under a minute of CPU on an
# hour of audio; a CPU fallback burns through this long before the
# wall clock, so it is the second backstop behind the backend check.
cpu_seconds = 600
# Parent-side aggregate resident-memory ceiling over the worker's
# whole process group, engine child included. 6 GiB.
max_resident_bytes = 6442450944
# An hour of transcript is around 200 KB of engine output, so 4 MiB
# refuses a runaway response with a wide margin. 4 MiB.
max_response_bytes = 4194304
# Engine diagnostics land on stderr; 4 MiB bounds a flood. 4 MiB.
max_stderr_bytes = 4194304
# Sits above the 1 GiB decoded-size preflight, so the preflight is
# the arbiter and RLIMIT_FSIZE only backstops it. 1.125 GiB.
file_size_bytes = 1207959552
# The accelerator driver spins its own threads; a per-uid ceiling.
max_processes = 64
# The pinned transcription language. The adapter sends it on every
# request and honors a request language only when equal to it.
language = "en"

# The pinned speech runtime, named by generic role label only and
# bound by BLAKE3. The deployment supplies the paths through the
# runtime-inventory config; the cold worker re-hashes every file
# against these values immediately before preflight and execution.
# asr-decode-policy is not a file: it pins the exact serialized decode
# options built into the adapter, and the build refuses a rules file
# whose value disagrees with the built-in serialization. The fourth
# role, asr-probe, has no pinned hash yet: its row lands in a later
# versioned rules update, and until then the worker fails the engine
# path closed with asr-runtime-missing on the absent probe pin,
# before any preflight or execution.
[asr.inventory]
asr-cli = "abc021406ad1eda085da1cbcb899bccc89b1da04ce7cc26f083082d0ed252f7d"
asr-weights = "a25408281ffced74ee45c743d59deb11689c918fe4fa0d22e6f1924e365ac4ab"
asr-decode-policy = "f5f5ff161c4fea33411cfd2e51a52cfe5ed953c209eda24b395d8574c4d32871"

# Image-metadata parser ceilings, versioned with the rest of the rules.
# The metadata worker runs behind the shared platform-default jail, so
# these are the parser-surface ceilings only, not the wall-clock and
# address-space envelope the runner already imposes. The parent reads
# them and passes them into the jailed worker, which enforces them and
# fails a source over any ceiling with a stable image-metadata reason and
# no artifact. A deployment that needs more raises them in a visible
# versioned bump.
[image_metadata]
# Inflated-size ceiling for one compressed text block, the png zTXt and
# compressed iTXt streams above all. Checked incrementally during
# inflation so a decompression bomb is stopped before it lands. 16 MiB.
max_decompressed_bytes = 16777216
# Nesting-depth ceiling for an xmp parse.
max_xml_depth = 100
# Event-count ceiling for an xmp parse.
max_xml_events = 1000000
# Box-count ceiling for an iso base media file format carrier.
max_boxes = 10000
# Ceiling on emitted metadata rows across all surfaces.
max_rows = 4096
# Ceiling on the rendered value bytes, under the runner response cap.
# 16 MiB.
max_output_bytes = 16777216
