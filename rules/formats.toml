# Format table for text-mirror.
#
# Detection maps magic bytes and file extensions to the format ids
# below. The version is recorded in every manifest record as
# rules_version, so a change here is a visible versioned event. It must
# match the version in converters.toml.

version = "5"

[[formats]]
id = "text"
name = "Plain text"
extensions = ["txt", "text", "log"]

[[formats]]
id = "markdown"
name = "Markdown"
extensions = ["md", "markdown"]

[[formats]]
id = "html"
name = "HTML"
extensions = ["html", "htm", "xhtml"]

[[formats]]
id = "csv"
name = "Comma-separated values"
extensions = ["csv"]

[[formats]]
id = "rtf"
name = "Rich Text Format"
extensions = ["rtf"]

[[formats]]
id = "odt"
name = "OpenDocument text"
extensions = ["odt"]

[[formats]]
id = "ods"
name = "OpenDocument spreadsheet"
extensions = ["ods"]

[[formats]]
id = "odp"
name = "OpenDocument presentation"
extensions = ["odp"]

[[formats]]
id = "epub"
name = "EPUB ebook"
extensions = ["epub"]

[[formats]]
id = "docx"
name = "Office Open XML document"
extensions = ["docx"]

[[formats]]
id = "xlsx"
name = "Office Open XML spreadsheet"
extensions = ["xlsx"]

[[formats]]
id = "xlsm"
name = "Office Open XML macro-enabled spreadsheet"
extensions = ["xlsm"]

[[formats]]
id = "xlsb"
name = "Excel binary spreadsheet"
extensions = ["xlsb"]

[[formats]]
id = "xla"
name = "Excel legacy add-in"
extensions = ["xla"]

[[formats]]
id = "xlam"
name = "Excel macro-enabled add-in"
extensions = ["xlam"]

[[formats]]
id = "pptx"
name = "Office Open XML presentation"
extensions = ["pptx"]

[[formats]]
id = "doc"
name = "Legacy Word document"
extensions = ["doc"]

[[formats]]
id = "xls"
name = "Legacy Excel spreadsheet"
extensions = ["xls"]

[[formats]]
id = "ppt"
name = "Legacy PowerPoint presentation"
extensions = ["ppt"]

[[formats]]
id = "pdf"
name = "Portable Document Format"
extensions = ["pdf"]

[[formats]]
id = "png"
name = "Portable Network Graphics image"
extensions = ["png"]

[[formats]]
id = "jpeg"
name = "JPEG image"
extensions = ["jpg", "jpeg"]

[[formats]]
id = "tiff"
name = "TIFF image"
extensions = ["tif", "tiff"]

[[formats]]
id = "mp3"
name = "MP3 audio"
extensions = ["mp3"]

[[formats]]
id = "wav"
name = "WAV audio"
extensions = ["wav"]

[[formats]]
id = "m4a"
name = "MPEG-4 audio"
extensions = ["m4a"]

[[formats]]
id = "mp4"
name = "MPEG-4 video"
extensions = ["mp4"]

[[formats]]
id = "mov"
name = "QuickTime video"
extensions = ["mov"]

[[formats]]
id = "zip"
name = "ZIP archive"
extensions = ["zip"]

[[formats]]
id = "eml"
name = "Email message"
extensions = ["eml"]

[[formats]]
id = "msg"
name = "Outlook message"
extensions = ["msg"]

# Text-native formats. Each routes to the plain text passthrough in
# converters.toml, which validates UTF-8 and fails closed on anything
# else, so a binary wearing one of these extensions records failed
# with invalid_utf8. One id per format so consumers can slice by
# detected_format.

[[formats]]
id = "json"
name = "JSON"
extensions = ["json"]

[[formats]]
id = "jsonl"
name = "JSON Lines"
extensions = ["jsonl", "ndjson"]

[[formats]]
id = "yaml"
name = "YAML"
extensions = ["yaml", "yml"]

[[formats]]
id = "xml"
name = "XML"
extensions = ["xml"]

[[formats]]
id = "tsv"
name = "Tab-separated values"
extensions = ["tsv"]

[[formats]]
id = "toml"
name = "TOML"
extensions = ["toml"]

[[formats]]
id = "ini"
name = "INI configuration"
extensions = ["ini", "cfg", "conf", "properties"]

# basenames matches exact file names for paths with no extension, so
# a file named exactly .env still declares its format.
[[formats]]
id = "env"
name = "Environment file"
extensions = ["env"]
basenames = [".env"]

# refines names the generic parent format whose magic these bytes
# also satisfy. When magic resolves to the parent and the extension
# declares the refinement, the declared id wins with no mismatch,
# because an svg is xml and the observations agree.
[[formats]]
id = "svg"
name = "Scalable Vector Graphics"
extensions = ["svg"]
refines = "xml"

