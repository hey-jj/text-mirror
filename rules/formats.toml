# Format table for text-mirror.
#
# Detection maps magic bytes and file extensions to the format ids
# below. The version is recorded in every manifest record as
# rules_version, so a change here is a visible versioned event. It must
# match the version in converters.toml.

version = "2"

[[formats]]
id = "text"
name = "Plain text"
extensions = ["txt", "text", "log"]

[[formats]]
id = "markdown"
name = "Markdown"
extensions = ["md", "markdown"]

[[formats]]
id = "html"
name = "HTML"
extensions = ["html", "htm", "xhtml"]

[[formats]]
id = "csv"
name = "Comma-separated values"
extensions = ["csv"]

[[formats]]
id = "rtf"
name = "Rich Text Format"
extensions = ["rtf"]

[[formats]]
id = "odt"
name = "OpenDocument text"
extensions = ["odt"]

[[formats]]
id = "ods"
name = "OpenDocument spreadsheet"
extensions = ["ods"]

[[formats]]
id = "odp"
name = "OpenDocument presentation"
extensions = ["odp"]

[[formats]]
id = "epub"
name = "EPUB ebook"
extensions = ["epub"]

[[formats]]
id = "docx"
name = "Office Open XML document"
extensions = ["docx"]

[[formats]]
id = "xlsx"
name = "Office Open XML spreadsheet"
extensions = ["xlsx"]

[[formats]]
id = "xlsm"
name = "Office Open XML macro-enabled spreadsheet"
extensions = ["xlsm"]

[[formats]]
id = "xlsb"
name = "Excel binary spreadsheet"
extensions = ["xlsb"]

[[formats]]
id = "xla"
name = "Excel legacy add-in"
extensions = ["xla"]

[[formats]]
id = "xlam"
name = "Excel macro-enabled add-in"
extensions = ["xlam"]

[[formats]]
id = "pptx"
name = "Office Open XML presentation"
extensions = ["pptx"]

[[formats]]
id = "doc"
name = "Legacy Word document"
extensions = ["doc"]

[[formats]]
id = "xls"
name = "Legacy Excel spreadsheet"
extensions = ["xls"]

[[formats]]
id = "ppt"
name = "Legacy PowerPoint presentation"
extensions = ["ppt"]

[[formats]]
id = "pdf"
name = "Portable Document Format"
extensions = ["pdf"]

[[formats]]
id = "png"
name = "Portable Network Graphics image"
extensions = ["png"]

[[formats]]
id = "jpeg"
